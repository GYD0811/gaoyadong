port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: '*'
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
external-controller: 0.0.0.0:9090
secret: ''
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  force-domain:
  - +.v2ex.com
  skip-domain:
  - +.baidu.com
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - rule-set:private_domain,cn_domain
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  default-nameserver:
  - 10.10.10.252
  - 114.114.114.114
  - 223.5.5.5
  proxy-server-nameserver:
  - 10.10.10.252
  - https://223.5.5.5/dns-query
  nameserver:
  - 10.10.10.252
  - 114.114.114.114
  - 223.5.5.5
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
