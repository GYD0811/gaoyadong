- name: 🇭🇰 香港节点
  type: select
  use:
  - all
  filter: (?i)港|hk|hongkong|hong kong
- name: 🇯🇵 日本节点
  type: select
  use:
  - all
  filter: (?i)日|jp|japan
- name: 🇺🇲 美国节点
  type: select
  use:
  - all
  filter: (?i)美|us|unitedstates|united states
- name: 🇩🇪 德国节点
  type: select
  use:
  - all
  filter: (?i)德|de|germany
- name: 🇸🇬 新加坡节点
  type: select
  use:
  - all
  filter: (?i)新|sg|singapore
- name: 🇰🇷 韩国节点
  type: select
  use:
  - all
  filter: (?i)韩|kr|korea
- name: 🇬🇧 英国节点
  type: select
  use:
  - all
  filter: (?i)英|uk|britain|united kingdom
- name: ♻️ 香港智能
  type: smart
  uselightgbm: true
  collectdata: true
  interval: 300
  use:
  - all
  filter: (?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美|德)).)*$
  policy-priority: DE:1.5;Premium:0.9;HK:0.7;MO:0.7;澳门:0.7
- name: ♻️ 日本智能
  type: smart
  uselightgbm: true
  collectdata: true
  interval: 300
  use:
  - all
  filter: (?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美|德)).)*$
  policy-priority: DE:1.5;Premium:0.9;HK:0.7;MO:0.7;澳门:0.7
- name: ♻️ 美国智能
  type: smart
  uselightgbm: true
  collectdata: true
  interval: 300
  use:
  - all
  filter: (?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新|德)).)*$
  policy-priority: DE:1.5;Premium:0.9;HK:0.7;MO:0.7;澳门:0.7
- name: ♻️ 德国智能
  type: smart
  uselightgbm: true
  collectdata: true
  interval: 300
  use:
  - all
  filter: (?=.*(德|DE|(?i)Germany))^((?!(港|台|日|韩|新|美)).)*$
  policy-priority: DE:1.5;Premium:0.9;HK:0.7;MO:0.7;澳门:0.7
- name: ♻️ 新加坡智能
  type: smart
  uselightgbm: true
  collectdata: true
  interval: 300
  use:
  - all
  filter: (?=.*(新|SG|(?i)Singapore))^((?!(港|台|日|韩|美|德)).)*$
  policy-priority: DE:1.5;Premium:0.9;HK:0.7;MO:0.7;澳门:0.7
- name: 🔯 香港故转
  type: fallback
  use:
  - all
  tolerance: 20
  interval: 300
  filter: (?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美|德)).)*$
- name: 🔯 日本故转
  type: fallback
  use:
  - all
  tolerance: 20
  interval: 300
  filter: (?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美|德)).)*$
- name: ♻️ 自动选择
  type: url-test
  use:
  - all
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 20
proxy-providers:
